<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Case study – Adeen Ali</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231f8a5b'/%3E%3Ctext x='50' y='70' font-size='58' font-weight='700' text-anchor='middle' fill='white' font-family='sans-serif'%3EA%3C/text%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --c: #1f8a5b;
      --d: #3d4449;
      --l: #f5f6f7;
      --m: #7f888f
    }

    * {
      box-sizing: border-box;
      margin: 0
    }

    body {
      font: 400 1.08rem/1.75 'Source Sans 3', sans-serif;
      color: var(--d)
    }

    .w {
      max-width: 820px;
      margin: auto;
      padding: 0 24px
    }

    header {
      border-bottom: 2px solid var(--d);
      padding: 18px 0
    }

    .back {
      font-weight: 600;
      color: var(--c);
      text-decoration: none
    }

    h1 {
      font-size: 2.4rem;
      line-height: 1.2;
      margin: 1.6rem 0 .3rem
    }

    .sub {
      color: var(--m);
      font-size: 1.15rem
    }

    h2 {
      font-size: 1.35rem;
      margin: 2.2rem 0 .6rem;
      padding-bottom: .25em;
      border-bottom: 2px solid var(--d);
      position: relative
    }

    h2::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -2px;
      height: 2px;
      width: 2.6em;
      background: var(--c)
    }

    ul,
    ol {
      padding-left: 1.3em
    }

    li {
      margin: .4em 0
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px
    }

    .tags span {
      background: var(--l);
      border-radius: 20px;
      padding: .1em .9em;
      font-size: .95rem
    }

    .btn {
      display: inline-block;
      padding: .65em 1.5em;
      border: 2px solid var(--d);
      border-radius: 4px;
      font-weight: 600;
      font-size: .78rem;
      letter-spacing: .16em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--d);
      margin: 0 8px 8px 0
    }

    .btn.p {
      background: var(--c);
      border-color: var(--c);
      color: #fff
    }

    .soon {
      margin-top: 2rem;
      padding: 1em 1.2em;
      background: var(--l);
      border-radius: 4px;
      color: var(--m)
    }

    footer {
      margin: 3.5rem 0 2rem;
      color: var(--m);
      font-size: .95rem
    }

    .md h1 {
      font-size: 2.2rem;
      line-height: 1.25;
      margin: 1.4rem 0 .6rem
    }

    .md h3 {
      font-size: 1.15rem;
      margin: 1.6rem 0 .4rem
    }

    .md p,
    .md li {
      margin: .5em 0
    }

    .md table {
      border-collapse: collapse;
      display: block;
      overflow-x: auto;
      margin: 1rem 0;
      font-size: .98rem
    }

    .md th,
    .md td {
      border: 1px solid #d8dde1;
      padding: .5em .8em;
      text-align: left
    }

    .md th {
      background: var(--l)
    }

    .md blockquote {
      border-left: 4px solid var(--c);
      background: var(--l);
      margin: 1rem 0;
      padding: .6em 1em
    }

    .md code {
      background: var(--l);
      padding: .1em .35em;
      border-radius: 3px;
      font-size: .92em
    }

    .md pre {
      background: var(--l);
      padding: 1em;
      border-radius: 4px;
      overflow-x: auto
    }

    .md pre code {
      background: none;
      padding: 0
    }

    .md img {
      max-width: 100%;
      border: 2px solid var(--d);
      border-radius: 4px
    }

    .md hr {
      border: 0;
      border-top: 2px solid var(--l);
      margin: 2rem 0
    }

    .wide {
      max-width: 920px
    }

    .wide-page .w {
      max-width: 920px
    }
  </style>
</head>

<body>
  <header>
    <div class="w"><a class="back" href="index.html#projects">← Back to portfolio</a></div>
  </header>
  <main class="w" id="app"></main>
  <footer class="w">Meer Adeen Ali · Hyderabad, India</footer>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="cases.js"></script>
  <script>
    const key = new URLSearchParams(location.search).get('p'), c = CASES[key], app = document.getElementById('app');
    const sec = (h, b) => b ? `<h2>${h}</h2>${b}` : '';
    const ul = (a, t = 'ul') => a && a.length ? `<${t}>${a.map(x => `<li>${x}</li>`).join('')}</${t}>` : '';
    const buttons = c => `<p style="margin-top:2rem"><a class="btn" href="${c.src}" target="_blank" rel="noopener">Source code</a>${c.live ? `<a class="btn p" href="${c.live}" target="_blank" rel="noopener">Live demo ↗</a>` : ''}</p>`;

    /* structured case study built from the fields in cases.js */
    function structured() {
      document.title = c.title + ' – case study';
      const parts = [
        sec('The question', c.q && `<p>${c.q}</p>`),
        sec('The data', c.data && `<p>${c.data}</p>`),
        sec('What I did', ul(c.steps, 'ol')),
        sec('What I found', ul(c.findings)),
        sec('What I would recommend', ul(c.next)),
        sec('What I learned', ul(c.learned)),
        sec('Tools', c.tools && c.tools.length ? `<div class="tags">${c.tools.map(t => `<span>${t}</span>`).join('')}</div>` : '')
      ].filter(Boolean);
      app.innerHTML = `<h1>${c.title}</h1><p class="sub">${c.sub || ''}</p>` + parts.join('') +
        (parts.length < 3 ? '<p class="soon">The full write-up is coming soon. The code is on GitHub.</p>' : '') + buttons(c);
    }

    /* show markdown text as the case study */
    function show(text, raw, blob) {
      app.classList.add('wide'); document.body.classList.add('wide-page');
      app.innerHTML = `<div class="md">${marked.parse(text)}</div>` + buttons(c);
      const md = app.querySelector('.md');
      md.querySelectorAll('img').forEach(i => { const s = i.getAttribute('src'); if (raw && !/^(https?:|data:)/.test(s)) i.src = raw + s.replace(/^\.?\//, '') });
      md.querySelectorAll('a').forEach(a => { const h = a.getAttribute('href') || ''; if (blob && !/^(https?:|#|mailto:)/.test(h)) a.href = blob + h.replace(/^\.?\//, ''); if (/^https?:/.test(a.href)) a.target = '_blank'; a.rel = 'noopener' });
      md.querySelectorAll('a > img').forEach(i => i.parentElement.href = i.src);
      (c.hide || []).forEach(t => { const h = [...md.querySelectorAll('h2')].find(x => x.textContent.trim() === t); if (!h) return; while (h.nextElementSibling && h.nextElementSibling.tagName !== 'H2') h.nextElementSibling.remove(); h.remove() });
      const h1 = md.querySelector('h1'); document.title = (h1 ? h1.textContent : c.title) + ' – case study';
    }

    /* read case-studies/NAME.md from the site folder (or the file named by md: in cases.js) */
    async function fromFolder() {
      try {
        const r = await fetch(c.md || `case-studies/${key}.md`);
        if (r.ok) { show(await r.text()); return true }
      } catch (e) { }
      return false
    }

    if (!c) app.innerHTML = '<h1>Case study not found</h1>';
    else {
      app.innerHTML = '<p class="sub" style="margin-top:2rem">Loading…</p>';
      /* order: markdown file in case-studies/, then the fields in cases.js. Nothing is read from GitHub. */
      fromFolder().then(ok => { if (!ok) structured() });
    }
  </script>
</body>

</html>
